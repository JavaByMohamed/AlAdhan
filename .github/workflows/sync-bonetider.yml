name: Sync bonetider live JSON

on:
  schedule:
    # Run twice to handle Stockholm DST shifts, then gate to exact Stockholm midnight.
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run only at Stockholm midnight
        id: stockholm-time
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=Europe/Stockholm date +%H)
          if [ "$hour" != "00" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.stockholm-time.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync timetable
        if: steps.stockholm-time.outputs.skip != 'true'
        run: npm run sync:bonetider

      - name: Commit and push changes
        if: steps.stockholm-time.outputs.skip != 'true'
        run: |
          if git diff --quiet -- data/islamiskaforbundet-bonetider.live.json; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/islamiskaforbundet-bonetider.live.json
          git commit -m "chore: sync bonetider live json"
          git push
